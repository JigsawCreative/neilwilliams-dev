name: Deploy WordPress Theme (SFTP)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Deploy via SFTP
        run: |
          lftp -u ${{ secrets.SFTP_USER }},${{ secrets.SFTP_PASS }} sftp://${{ secrets.SFTP_HOST }} <<EOF
          set sftp:auto-confirm yes
          set ssl:verify-certificate no

          mirror -R \
            ./ \
            /home/${{ secrets.SFTP_USER }}/public_html/wp-content/themes/neilwilliams \
            --delete \
            --verbose

          bye
          EOF